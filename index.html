<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Sistema de Cadastro de Alunos</h1>

        <nav>
            <a href="#">Início</a> |
            <a href="#">Cursos</a> |
            <a href="#">Contato</a>
        </nav>

        <hr>
    </header>

    <!-- Conteúdo Principal -->
    <main>

        <h2>Formulário de Cadastro</h2>

        <form id="formulario">

            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required>
            <br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="idade">Idade:</label><br>
            <input type="number" id="idade" name="idade" required>
            <br><br>

            <label for="data">Data de Nascimento:</label><br>
            <input type="date" id="data" name="data" required>
            <br><br>

            <label for="curso">Escolha um Curso:</label><br>
            <select id="curso" name="curso" required>
                <option value="">Selecione</option>
                <option value="informatica">Informática</option>
                <option value="administracao">Administração</option>
                <option value="design">Design</option>
            </select>
            <br><br>

            <p>Gênero:</p>

            <input type="radio" id="feminino" name="genero" value="Feminino" required>
            <label for="feminino">Feminino</label>

            <input type="radio" id="masculino" name="genero" value="Masculino">
            <label for="masculino">Masculino</label>

            <input type="radio" id="outro" name="genero" value="Outro">
            <label for="outro">Outro</label>

            <br><br>

            <input type="checkbox" id="termos" required>
            <label for="termos">Aceito os termos de uso</label>

            <br><br>

            <button type="submit">Enviar</button>

        </form>

    </main>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault();

            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;
            let idade = document.getElementById("idade").value;
            let data = document.getElementById("data").value;
            let curso = document.getElementById("curso").value;
            let genero = document.querySelector('input[name="genero"]:checked').value;

            alert(
                "Dados do Formulário:\n\n" +
                "Nome: " + nome + "\n" +
                "E-mail: " + email + "\n" +
                "Idade: " + idade + "\n" +
                "Data de Nascimento: " + data + "\n" +
                "Curso: " + curso + "\n" +
                "Gênero: " + genero
            );
        });
    </script>

    <!-- Rodapé -->
    <footer>
        <hr>
        <p>&copy; 2026 - Ana Eloisa. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
